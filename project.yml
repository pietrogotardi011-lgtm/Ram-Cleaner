name: PowerPilot
options:
  deploymentTarget:
    iOS: "17.0"
targets:
  PowerPilot:
    type: application
    platform: iOS
    sources: [PowerPilot]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.powerpilot
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: PowerPilot
    info:
      path: PowerPilot/Info.plist
      properties:
        UILaunchScreen: {}
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [com.example.powerpilot.refresh]
