name: Build PhotoFace deb
on:
  push:
    paths: ["PhotoFace/**", ".github/workflows/photoface.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: brew install ldid dpkg make xz
      - run: git clone --recursive https://github.com/theos/theos.git $HOME/theos
      - name: Build
        working-directory: PhotoFace
        run: |
          export THEOS=$HOME/theos
          export PATH="$(brew --prefix make)/libexec/gnubin:$PATH"
          set +e
          make package FINALPACKAGE=1 > build.log 2>&1
          rc=$?
          if [ $rc -ne 0 ]; then
            grep -nE "error|Error|fatal|No rule|not found" build.log | head -12 | while IFS= read -r l; do echo "::error::$(echo "$l" | cut -c1-300)"; done
            tail -5 build.log | while IFS= read -r l; do echo "::error::TAIL $(echo "$l" | cut -c1-300)"; done
          fi
          exit $rc
      - uses: actions/upload-artifact@v4
        with:
          name: PhotoFace-deb
          path: PhotoFace/packages/*.deb
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete photoface-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create photoface-latest PhotoFace/packages/*.deb --title "PhotoFace (latest)" --notes "Auto-built .deb"
