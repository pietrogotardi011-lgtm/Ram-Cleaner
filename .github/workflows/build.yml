name: Build IPA
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build (unsigned)
        run: |
          xcodebuild -project RamTidy.xcodeproj -scheme RamTidy \
            -sdk iphoneos -configuration Release -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/RamTidy.app Payload/
          zip -qr RamTidy.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: RamTidy-unsigned-ipa
          path: RamTidy.ipa
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest RamTidy.ipa --title "Latest build" --notes "Unsigned IPA built by CI. Sign with Sideloadly/AltStore."
