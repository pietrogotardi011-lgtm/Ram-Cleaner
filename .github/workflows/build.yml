name: Build IPA
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Lint shortcut files
        run: for f in Shortcuts/*.shortcut; do plutil -lint "$f"; done
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build (unsigned)
        run: |
          xcodebuild -project PowerPilot.xcodeproj -scheme PowerPilot \
            -sdk iphoneos -configuration Release -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/PowerPilot.app Payload/
          zip -qr PowerPilot.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: PowerPilot-unsigned-ipa
          path: PowerPilot.ipa
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest PowerPilot.ipa --title "Latest build" --notes "Unsigned IPA built by CI. Sign with iLoader/Sideloadly/AltStore."
